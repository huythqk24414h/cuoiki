name: LiquidityLab offline checks
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run dashboard tests
        run: node --test tests/*.test.cjs
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python checks without local SSI archives
        run: python -m unittest discover -s tests -v
