name: LiquidityLab · Kiểm thử ngoại tuyến
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Kiểm thử giao diện
        run: node --test tests/*.test.cjs
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài thư viện kiểm thử nghiên cứu
        run: python -m pip install -r requirements-research.txt
      - name: Kiểm thử Python trên bản sạch
        run: python -m unittest discover -s tests -v
