name: SSI Collector Health
on:
  schedule:
    - cron: '13,43 0-11 * * 1-5'
  workflow_dispatch:
    inputs:
      follow_session:
        description: Keep checking chart collectors for this trading session
        type: boolean
        default: false
  workflow_run:
    workflows: ['SSI Live Capture', 'SSI Intraday OHLCV', 'SSI Intraday Index and Board Summary', 'SSI Market History']
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: ssi-collector-health
  cancel-in-progress: false
jobs:
  recover:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: inputs.follow_session != true
        run: python -m scripts.reconcile_collectors
      - if: inputs.follow_session == true
        run: python -m scripts.watch_session_collectors
