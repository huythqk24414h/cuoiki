name: SSI Market History
on:
  workflow_dispatch:
    inputs:
      full_backfill:
        description: Rebuild all series from the first Vietnam trading date
        type: boolean
        default: false
      batch_size:
        description: Maximum new daily series this run (1–40)
        type: number
        default: 8
  schedule:
    - cron: '37 9 * * 1-5'
    - cron: '11 11 * * 1-5'
permissions:
  contents: read
concurrency:
  group: ssi-market-history
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' && vars.SSI_PUBLISH_EOD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SSI_FULL_BACKFILL: ${{ inputs.full_backfill || false }}
      SSI_EOD_SYMBOLS: ${{ vars.SSI_EOD_SYMBOLS || 'VN30' }}
      SSI_EOD_BACKFILL_BATCH: ${{ inputs.batch_size || vars.SSI_EOD_BACKFILL_BATCH || 8 }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ssi.txt
      - run: python -m scripts.publish_market_history
