name: SSI Intraday OHLCV
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Maximum new intraday series this run (up to the symbol cap)
        type: number
        default: 8
      follow_session:
        description: Refresh every 15 minutes until the market closes
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * 1-5'
permissions:
  contents: read
concurrency:
  group: ssi-intraday
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' && vars.SSI_PUBLISH_EOD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SSI_INTRADAY_FOLLOW_SESSION: ${{ github.event_name == 'schedule' || inputs.follow_session }}
      SSI_INTRADAY_SYMBOLS: ${{ vars.SSI_INTRADAY_SYMBOLS || 'VN30' }}
      SSI_INTRADAY_BACKFILL_BATCH: ${{ inputs.batch_size || vars.SSI_INTRADAY_BACKFILL_BATCH || 8 }}
      SSI_INTRADAY_MAX_SYMBOLS: ${{ vars.SSI_INTRADAY_MAX_SYMBOLS || 32 }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ssi.txt
      - run: python -m scripts.run_intraday_session
