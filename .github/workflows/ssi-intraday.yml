name: SSI Intraday OHLCV
on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 2-3 * * 1-5'
    - cron: '2,17,32 4 * * 1-5'
    - cron: '2,17,32,47 6 * * 1-5'
    - cron: '2,17,32 7 * * 1-5'
permissions:
  contents: read
concurrency:
  group: ssi-intraday
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' && vars.SSI_PUBLISH_EOD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SSI_INTRADAY_SYMBOLS: ${{ vars.SSI_INTRADAY_SYMBOLS || 'SSI,FPT,HPG' }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ssi.txt
      - run: python -m scripts.publish_intraday

