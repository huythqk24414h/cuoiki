name: SSI Live Capture
on:
  workflow_dispatch:
    inputs:
      session:
        description: SSI trading session (Vietnam time)
        type: choice
        options: [morning, afternoon]
        default: morning
  schedule:
    - cron: '57 1 * * 1-5'
    - cron: '57 5 * * 1-5'
permissions:
  contents: read
concurrency:
  group: ssi-live-capture-${{ github.event.schedule == '57 5 * * 1-5' && 'afternoon' || inputs.session || 'morning' }}
  cancel-in-progress: false
jobs:
  morning:
    if: ${{ github.event.schedule == '57 1 * * 1-5' || inputs.session == 'morning' }}
    runs-on: ubuntu-latest
    timeout-minutes: 165
    env:
      SSI_CAPTURE_SESSION: morning
      SSI_PUBLISH_LIVE: ${{ vars.SSI_PUBLISH_LIVE }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ssi-capture
          clean: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SSI SDK
        working-directory: ssi-capture
        run: python -m pip install -r requirements-ssi.txt
      - name: Capture order book
        working-directory: ssi-capture
        run: python -m scripts.capture_order_book
  afternoon:
    if: ${{ github.event.schedule == '57 5 * * 1-5' || inputs.session == 'afternoon' }}
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      SSI_CAPTURE_SESSION: afternoon
      SSI_PUBLISH_LIVE: ${{ vars.SSI_PUBLISH_LIVE }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ssi-capture
          clean: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SSI SDK
        working-directory: ssi-capture
        run: python -m pip install -r requirements-ssi.txt
      - name: Capture order book
        working-directory: ssi-capture
        run: python -m scripts.capture_order_book
