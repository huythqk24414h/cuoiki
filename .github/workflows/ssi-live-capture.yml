name: SSI Live Capture
on:
  workflow_dispatch:
    inputs:
      session:
        description: SSI trading session (Vietnam time)
        type: choice
        options: [morning, afternoon]
        default: morning
  schedule:
    - cron: '57 1 * * 1-5'
    - cron: '57 5 * * 1-5'
    - cron: '7 2 * * 1-5'
    - cron: '7 6 * * 1-5'
permissions:
  contents: write
concurrency:
  group: ssi-live-capture-${{ (github.event_name == 'push' || github.event.schedule == '57 5 * * 1-5' || github.event.schedule == '7 6 * * 1-5') && 'afternoon' || inputs.session || 'morning' }}
  cancel-in-progress: false
jobs:
  morning:
    if: ${{ github.event.schedule == '57 1 * * 1-5' || github.event.schedule == '7 2 * * 1-5' || inputs.session == 'morning' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SSI_CAPTURE_SESSION: morning
      SSI_PUBLISH_LIVE: ${{ vars.SSI_PUBLISH_LIVE }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ssi-capture
          clean: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SSI SDK
        working-directory: ssi-capture
        run: python -m pip install -r requirements-ssi.txt
      - name: Capture order book
        working-directory: ssi-capture
        run: python -m scripts.capture_order_book
      - name: Preserve raw research samples in Releases
        if: always()
        working-directory: ssi-capture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m scripts.archive_capture_release
  afternoon:
    if: ${{ github.event_name == 'push' || github.event.schedule == '57 5 * * 1-5' || github.event.schedule == '7 6 * * 1-5' || inputs.session == 'afternoon' }}
    runs-on: ubuntu-latest
    timeout-minutes: 205
    env:
      SSI_CAPTURE_SESSION: afternoon
      SSI_PUBLISH_LIVE: ${{ vars.SSI_PUBLISH_LIVE }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ssi-capture
          clean: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SSI SDK
        working-directory: ssi-capture
        run: python -m pip install -r requirements-ssi.txt
      - name: Capture order book
        working-directory: ssi-capture
        run: python -m scripts.capture_order_book
      - name: Preserve raw research samples in Releases
        if: always()
        working-directory: ssi-capture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m scripts.archive_capture_release
