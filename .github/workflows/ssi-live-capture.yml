name: SSI · Thu sổ lệnh trực tiếp
on:
  workflow_dispatch:
    inputs:
      session:
        description: Buổi giao dịch SSI theo giờ Việt Nam
        type: choice
        options: [morning, afternoon]
        default: morning
  schedule:
    - cron: '57 1 * * 1-5'
    - cron: '57 5 * * 1-5'
    - cron: '7 2 * * 1-5'
    - cron: '7 6 * * 1-5'
permissions:
  contents: write
concurrency:
  group: ssi-live-capture-${{ (github.event_name == 'push' || github.event.schedule == '57 5 * * 1-5' || github.event.schedule == '7 6 * * 1-5') && 'afternoon' || inputs.session || 'morning' }}
  cancel-in-progress: false
jobs:
  morning:
    if: ${{ github.event.schedule == '57 1 * * 1-5' || github.event.schedule == '7 2 * * 1-5' || inputs.session == 'morning' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SSI_CAPTURE_SESSION: morning
      SSI_PUBLISH_LIVE: ${{ vars.SSI_PUBLISH_LIVE }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ssi-capture
          clean: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài thư viện SSI
        working-directory: ssi-capture
        run: python -m pip install -r requirements-ssi.txt
      - name: Chuẩn bị nơi lưu dữ liệu nghiên cứu
        continue-on-error: true
        working-directory: ssi-capture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m scripts.archive_capture_release --prepare
      - name: Thu sổ lệnh
        working-directory: ssi-capture
        run: python -m scripts.capture_order_book
      - name: Lưu mẫu thô vào Releases
        if: always()
        working-directory: ssi-capture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m scripts.archive_capture_release
      - name: Lưu bản nén dự phòng
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssi-backup-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ssi-capture/data/research_exports/**/*.gz
            ssi-capture/data/research_exports/**/*manifest.json
          retention-days: 2
          if-no-files-found: warn
  afternoon:
    if: ${{ github.event_name == 'push' || github.event.schedule == '57 5 * * 1-5' || github.event.schedule == '7 6 * * 1-5' || inputs.session == 'afternoon' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SSI_CAPTURE_SESSION: afternoon
      SSI_PUBLISH_LIVE: ${{ vars.SSI_PUBLISH_LIVE }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
      SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ssi-capture
          clean: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài thư viện SSI
        working-directory: ssi-capture
        run: python -m pip install -r requirements-ssi.txt
      - name: Chuẩn bị nơi lưu dữ liệu nghiên cứu
        continue-on-error: true
        working-directory: ssi-capture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m scripts.archive_capture_release --prepare
      - name: Thu sổ lệnh
        working-directory: ssi-capture
        run: python -m scripts.capture_order_book
      - name: Lưu mẫu thô vào Releases
        if: always()
        working-directory: ssi-capture
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m scripts.archive_capture_release
      - name: Lưu bản nén dự phòng
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssi-backup-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ssi-capture/data/research_exports/**/*.gz
            ssi-capture/data/research_exports/**/*manifest.json
          retention-days: 2
          if-no-files-found: warn
